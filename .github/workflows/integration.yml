name: Integration
'on':
  workflow_dispatch: {}
jobs:
  integration:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-26
          - windows-2025
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      PLAYWRIGHT_BROWSERS_PATH: 0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm run build
      - uses: actions/checkout@v7
        with:
          repository: lvce-editor/lvce-editor
          ref: 55e543409575ae3504ddcde020a84535f7827475
          path: .tmp/lvce-integration
      - uses: actions/setup-node@v6
        with:
          node-version-file: .tmp/lvce-integration/.nvmrc
      - name: Install application dependencies
        working-directory: .tmp/lvce-integration
        run: npm ci
      - name: Install Chromium
        working-directory: .tmp/lvce-integration/packages/extension-host-worker-tests
        run: npx playwright install --with-deps chromium
      - name: Prepare owned integration tests
        run: node packages/e2e-integration/prepare.mjs .tmp/lvce-integration
      - name: Build application server
        working-directory: .tmp/lvce-integration
        run: npm run build:server
      - name: Export application tests
        working-directory: .tmp/lvce-integration
        run: npm run test-static-export
      - name: Run owned integration tests
        working-directory: .tmp/lvce-integration/packages/extension-host-worker-tests
        shell: bash
        run: npm run e2e:headless -- --ci
